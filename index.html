<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מלחמת העידנים – War of the Ages</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;font-family:Heebo,'Noto Sans Arabic',Arial,sans-serif;color:#e9edf2;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.pnl{background:rgba(14,18,24,.92);border:1px solid #2a3544;border-radius:14px;backdrop-filter:blur(6px)}
.b{background:#1d2530;border:1px solid #2e3a4a;border-radius:9px;padding:6px 10px;font-size:13px}
.b:hover{background:#263142}
.b.on{border-color:#ffc94a;background:#3a3220;box-shadow:0 0 0 1px #ffc94a inset}
.b.go{background:#2c7a3c;border-color:#4fbf63;font-weight:800}
.b.go:hover{background:#35914a}
.b.warn{background:#8a6a1c;border-color:#e0b44a}
select.b{cursor:pointer}
/* ---------- MENU ---------- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,8,12,.25),rgba(5,8,12,.75))}
.mp{width:min(560px,94vw);max-height:92vh;overflow:auto;padding:22px}
.mp.wide{width:min(980px,96vw)}
.logo{text-align:center;margin-bottom:6px}
.logo h1{margin:0;font-size:46px;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,#ffd36a,#ff8a3d,#ff4f6a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.logo p{margin:2px 0 0;color:#a9b6c6;font-size:15px}
.mbtns{display:grid;gap:10px;margin-top:18px}
.mbtn{display:flex;align-items:center;gap:14px;text-align:start;background:linear-gradient(180deg,#232d3a,#1a222d);border:1px solid #33425a;border-radius:14px;padding:12px 16px;font-size:18px;font-weight:800;transition:transform .1s}
.mbtn:hover{transform:translateY(-1px);border-color:#ffc94a}
.mbtn .i{font-size:30px;width:40px;text-align:center}
.mbtn small{display:block;font-weight:400;font-size:12.5px;color:#9fb0c3}
.mfoot{margin-top:14px;text-align:center;color:#9fb0c3;font-size:13px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh h2{margin:0;font-size:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.lbl{min-width:120px;color:#a9b6c6;font-size:14px}
.era-h{margin:14px 0 6px;font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center}
.lvls{display:grid;grid-template-columns:repeat(15,1fr);gap:5px}
.lv{aspect-ratio:1;border-radius:8px;border:1px solid #33425a;background:#1d2530;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0}
.lv small{font-size:9px;color:#ffd36a;font-weight:400}
.lv.boss{background:#3b1d24;border-color:#ff6a7a}
.lv.lock{opacity:.35;cursor:not-allowed}
.lv.cur{box-shadow:0 0 0 2px #ffc94a}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.skin{border:1px solid #33425a;border-radius:10px;padding:8px;background:#1d2530;text-align:center;font-size:13px}
.skin .sw{height:44px;border-radius:7px;margin-bottom:6px;display:flex;overflow:hidden}
.skin .sw i{flex:1}
.skin.sel{border-color:#ffc94a;box-shadow:0 0 0 1px #ffc94a inset}
.skin.lock{opacity:.45}
/* ---------- HUD ---------- */
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.tb{background:rgba(14,18,24,.9);border:1px solid #273140;border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap}
button.tb:hover{background:rgba(32,40,52,.95)}
#startB{background:#2c7a3c;border-color:#4fbf63;font-weight:800;font-size:14px;padding:6px 16px}
#startB.pause{background:#8a6a1c;border-color:#e0b44a}
#money{font-weight:800;color:#ffd36a;font-size:15px}
#chips{display:flex;gap:6px}
.chip{font-weight:800}
.tb.seg{padding:3px;display:flex}
.tb.seg button{border:none;background:transparent;padding:3px 7px;border-radius:7px;font-size:12px}
.tb.seg button.on{background:#3a3220;outline:1px solid #ffc94a}
#title{font-weight:800}
#side{position:fixed;top:56px;right:8px;width:270px;bottom:206px;overflow-y:auto;padding:10px;font-size:13px}
#side .sec{font-size:12px;color:#9aa7b6;margin:10px 0 5px;font-weight:600}
#side .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ob{background:#1d2530;border:1px solid #2e3a4a;border-radius:8px;padding:4px 2px;font-size:11px;text-align:center;line-height:1.15}
.ob .ic{display:block;font-size:18px}
.ob.on{border-color:#ffc94a;background:#3a3220}
.seg2{display:flex;gap:4px;flex-wrap:wrap}
.seg2 button{flex:1;background:#1d2530;border:1px solid #2e3a4a;border-radius:7px;padding:4px 0;font-size:12px;min-width:30px}
.seg2 button.on{background:#3a3220;border-color:#ffc94a}
.botrow{display:grid;grid-template-columns:22px 1fr 1fr 1fr 34px;gap:3px;align-items:center;margin-bottom:4px}
.botrow select{background:#1d2530;border:1px solid #2e3a4a;border-radius:6px;font-size:11px;padding:2px}
.botrow button{background:#2c5a7a;border:1px solid #4a8ab4;border-radius:6px;padding:2px 0}
#bottom{position:fixed;left:8px;right:8px;bottom:8px;height:192px;padding:6px 8px;display:flex;flex-direction:column}
#tabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:6px}
#tabs button{background:#1d2530;border:1px solid #2e3a4a;border-radius:8px;padding:3px 9px;font-size:12px;white-space:nowrap}
#tabs button.on{background:#3a3220;border-color:#ffc94a}
#ucards{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;flex:1;padding-bottom:4px}
.uc{flex:0 0 112px;background:linear-gradient(180deg,#222c38,#19212b);border:1px solid #33425a;border-radius:10px;padding:5px 6px;text-align:center;position:relative;font-size:11.5px;line-height:1.35}
.uc:hover{border-color:#7a8ea8}
.uc.on{border-color:#ffc94a;box-shadow:0 0 0 1px #ffc94a inset;background:#3a3220}
.uc.lock{opacity:.4}
.uc.poor{opacity:.55}
.uc .ic{font-size:26px;line-height:1.2}
.uc .nm{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc .cost{color:#ffd36a;font-weight:800}
.uc .st{display:flex;justify-content:space-around;color:#c4ceda}
.uc .pw{height:4px;background:#2a3340;border-radius:2px;margin-top:3px;overflow:hidden}
.uc .pw i{display:block;height:100%;background:linear-gradient(90deg,#4fbf63,#ffc94a,#ff5547)}
.uc .era{position:absolute;top:3px;left:5px;font-size:12px}
.uc .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(0,0,0,.45);border-radius:10px;font-weight:800}
#tip{position:fixed;bottom:208px;left:50%;transform:translateX(-50%);width:min(460px,90vw);padding:10px 12px;font-size:13px;line-height:1.55;pointer-events:none}
#tip b{font-size:15px}
#tip .st{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px;margin-top:5px;color:#c4ceda}
#bossbar{position:fixed;top:56px;left:50%;transform:translateX(-50%);width:min(520px,60vw);padding:6px 10px;text-align:center;font-weight:800}
#bossbar .bb{height:12px;background:#301418;border-radius:6px;overflow:hidden;margin-top:4px}
#bossbar .bb i{display:block;height:100%;background:linear-gradient(90deg,#ff4f6a,#ff9a3d)}
#tut{position:fixed;top:104px;left:50%;transform:translateX(-50%);width:min(520px,90vw);padding:14px 16px;border:2px solid #ffc94a;font-size:15px;line-height:1.6}
#tut .tn{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#1d2530;border:1px solid #ffc94a;border-radius:10px;padding:8px 14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5;text-align:center}
#end,#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:10}
#end .pnl{padding:22px 28px;text-align:center;min-width:340px;max-width:92vw}
#end h2{margin:0 0 6px;font-size:34px}
#end .rw{margin:10px 0;line-height:1.8;color:#c9d3de}
#end .stars{font-size:34px;letter-spacing:4px}
#modal .pnl{width:min(900px,96vw);max-height:90vh;overflow:auto;padding:18px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.mapc{background:#1d2530;border:1px solid #2e3a4a;border-radius:9px;padding:7px;text-align:right;font-size:12.5px}
.mapc b{display:block;font-size:13.5px}
.mapc.on{border-color:#ffc94a;background:#3a3220}
.form{display:grid;grid-template-columns:140px 1fr 60px;gap:6px 10px;align-items:center}
.form input[type=range]{width:100%}
.form input[type=text],.form select{background:#1d2530;border:1px solid #2e3a4a;border-radius:7px;padding:4px 6px}
#info{position:fixed;left:8px;top:56px;width:230px;padding:10px;font-size:13px;line-height:1.6}
#info .x{position:absolute;left:8px;top:4px;background:none;border:none;font-size:16px}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);padding:18px 26px;text-align:center;border:2px solid #ffc94a}
#banner h2{margin:0 0 8px;font-size:28px}
#hov{position:fixed;pointer-events:none;background:rgba(10,14,20,.92);border:1px solid #3a4a5e;border-radius:9px;padding:5px 9px;font-size:12.5px;line-height:1.45;z-index:4;white-space:nowrap}
#hov .hb{height:6px;background:#2a3340;border-radius:3px;overflow:hidden;margin-top:3px;width:140px}
#hov .hb i{display:block;height:100%}
#help{position:fixed;left:8px;bottom:208px;font-size:11.5px;color:#c9d3de;background:rgba(14,18,24,.75);border-radius:9px;padding:5px 9px;max-width:420px;line-height:1.5}
@media (max-width:820px){ #side{width:210px} .logo h1{font-size:32px} .lvls{grid-template-columns:repeat(8,1fr)} #help{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- ============ MENU ============ -->
<div id="menu">
  <div class="pnl mp" id="mMain">
    <div class="logo"><h1>⚔️ <span data-i="title"></span></h1><p data-i="subtitle"></p></div>
    <div class="mbtns">
      <button class="mbtn" data-go="campaign"><span class="i">🎖️</span><span><span data-i="m_camp"></span><small data-i="m_camp_s"></small></span></button>
      <button class="mbtn" data-go="skirm"><span class="i">🤖</span><span><span data-i="m_skirm"></span><small data-i="m_skirm_s"></small></span></button>
      <button class="mbtn" data-go="sandbox"><span class="i">🧪</span><span><span data-i="m_sand"></span><small data-i="m_sand_s"></small></span></button>
      <button class="mbtn" data-go="tutorial"><span class="i">🎓</span><span><span data-i="m_tut"></span><small data-i="m_tut_s"></small></span></button>
      <button class="mbtn" data-go="skins"><span class="i">🎨</span><span><span data-i="m_skins"></span><small data-i="m_skins_s"></small></span></button>
      <button class="mbtn" data-go="lang"><span class="i">🌐</span><span><span data-i="m_lang"></span><small data-i="m_lang_s"></small></span></button>
      <button class="mbtn" data-go="settings"><span class="i">⚙️</span><span data-i="m_set"></span></button>
    </div>
    <div class="mfoot" id="mFoot"></div>
  </div>

  <div class="pnl mp wide hide" id="mCampaign">
    <div class="mh"><h2>🎖️ <span data-i="m_camp"></span></h2><button class="b" data-back data-i="back"></button></div>
    <div class="row" id="campStat"></div>
    <div id="campLv"></div>
  </div>

  <div class="pnl mp hide" id="mSkirm">
    <div class="mh"><h2>🤖 <span data-i="m_skirm"></span></h2><button class="b" data-back data-i="back"></button></div>
    <div class="row"><span class="lbl" data-i="map"></span><button class="b" id="skMap"></button></div>
    <div class="row"><span class="lbl" data-i="size"></span><select class="b" id="skSize"></select></div>
    <div class="row"><span class="lbl" data-i="nbots"></span><span class="seg2" id="skBots" style="flex:1"><button data-n="1" class="on">1</button><button data-n="2">2</button><button data-n="3">3</button></span></div>
    <div class="row"><span class="lbl" data-i="diff"></span><span id="skDiffs" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
    <div class="row"><span class="lbl" data-i="budget"></span><select class="b" id="skBudget"><option>500</option><option>1000</option><option selected>2000</option><option>5000</option><option>10000</option><option>25000</option><option>50000</option></select></div>
    <div class="row"><span class="lbl" data-i="eras"></span><span id="skEras" style="display:flex;gap:8px;flex-wrap:wrap"></span></div>
    <div class="row"><span class="lbl" data-i="bosses"></span><label><input type="checkbox" id="skBoss"> <span data-i="allow_boss"></span></label></div>
    <div class="row"><span class="lbl" data-i="life"></span><label><input type="checkbox" id="skLife" checked> <span data-i="life_s"></span></label></div>
    <div class="row"><span class="lbl" data-i="tod"></span><select class="b" id="skTod"><option value="7" data-i="t_morning"></option><option value="12.5" selected data-i="t_noon"></option><option value="18.2" data-i="t_sunset"></option><option value="22" data-i="t_night"></option></select><label><input type="checkbox" id="skCycle"> <span data-i="cycle"></span></label></div>
    <div class="row" style="margin-top:16px"><button class="b go" id="skGo" style="font-size:17px;padding:9px 26px" data-i="go"></button></div>
  </div>

  <div class="pnl mp hide" id="mSandbox">
    <div class="mh"><h2>🧪 <span data-i="m_sand"></span></h2><button class="b" data-back data-i="back"></button></div>
    <div class="row"><span class="lbl" data-i="map"></span><button class="b" id="sbMap"></button></div>
    <div class="row"><span class="lbl" data-i="size"></span><select class="b" id="sbSize"></select></div>
    <div class="row"><span class="lbl" data-i="nteams"></span><span class="seg2" id="sbTeams" style="flex:1"><button data-n="2" class="on">2</button><button data-n="3">3</button><button data-n="4">4</button></span></div>
    <div class="row"><span class="lbl" data-i="tod"></span><select class="b" id="sbTod"><option value="7" data-i="t_morning"></option><option value="12.5" selected data-i="t_noon"></option><option value="18.2" data-i="t_sunset"></option><option value="22" data-i="t_night"></option></select></div>
    <div class="row"><span class="lbl" data-i="life"></span><label><input type="checkbox" id="sbLife" checked> <span data-i="life_s"></span></label></div>
    <p style="color:#9fb0c3;font-size:13px" data-i="sb_note"></p>
    <div class="row"><button class="b go" id="sbGo" style="font-size:17px;padding:9px 26px" data-i="sb_go"></button></div>
  </div>

  <div class="pnl mp wide hide" id="mSkins">
    <div class="mh"><h2>🎨 <span data-i="m_skins"></span></h2><button class="b" data-back data-i="back"></button></div>
    <p style="color:#9fb0c3;font-size:13px;margin-top:0" id="skinInfo"></p>
    <div class="cards" id="skinGrid"></div>
  </div>

  <div class="pnl mp hide" id="mLang">
    <div class="mh"><h2>🌐 <span data-i="lang_pick"></span></h2><button class="b" data-back data-i="back"></button></div>
    <div class="mbtns" id="langList"></div>
  </div>

  <div class="pnl mp hide" id="mSettings">
    <div class="mh"><h2>⚙️ <span data-i="m_set"></span></h2><button class="b" data-back data-i="back"></button></div>
    <div class="row"><label><input type="checkbox" id="setGore" checked> 🩸 <span data-i="set_gore"></span></label></div>
    <div class="row"><label><input type="checkbox" id="setShadow" checked> <span data-i="set_shadow"></span></label></div>
    <div class="row"><label><input type="checkbox" id="setSound" checked> <span data-i="set_sound"></span></label></div>
    <div class="row"><label><input type="checkbox" id="setMusic" checked> 🎵 <span data-i="set_music"></span></label></div>
    <div class="row"><span class="lbl">🔊 <span data-i="vol_master"></span></span><input type="range" id="setMaster" min="0" max="1" step="0.05" value="1" style="flex:1"></div>
    <div class="row"><span class="lbl">💥 <span data-i="vol_sfx"></span></span><input type="range" id="setSfx" min="0" max="1" step="0.05" value="1" style="flex:1"></div>
    <div class="row"><span class="lbl">🎵 <span data-i="set_vol"></span></span><input type="range" id="setVol" min="0" max="1" step="0.05" value="0.5" style="flex:1"></div>
    <div class="row"><button class="b" id="setReset" data-i="set_reset"></button></div>
  </div>
</div>

<!-- ============ HUD ============ -->
<div id="hud" class="hide">
  <div id="top">
    <button class="tb" id="menuB" data-i="menu"></button>
    <span class="tb" id="title"></span>
    <span class="tb" id="money"></span>
    <span class="tb" id="chips"></span>
    <button class="tb" id="startB"></button>
    <div class="tb seg" id="speeds"></div>
    <span class="tb" id="todL"></span>
    <button class="tb" id="musB">🎵</button>
    <button class="tb" id="sndB">🔊</button>
    <button class="tb" id="sideB" data-i="tools"></button>
  </div>
  <div class="pnl" id="side"></div>
  <div class="pnl" id="bottom"><div id="tabs"></div><div id="ucards"></div></div>
  <div class="pnl hide" id="tip"></div>
  <div class="pnl hide" id="bossbar"><span id="bossN"></span><div class="bb"><i id="bossHp"></i></div></div>
  <div class="pnl hide" id="tut"><div id="tutT"></div><div class="tn"><button class="b" id="tutSkip" data-i="skip_tut"></button><button class="b go" id="tutNext" data-i="next"></button></div></div>
  <div class="pnl hide" id="info"><button class="x" id="infoX">✕</button><div id="infoBody"></div></div>
  <div class="pnl hide" id="banner"><h2 id="bnT"></h2><div id="bnS" style="color:#b9c4d0;margin-bottom:10px"></div><button class="b go" id="bnReset" data-i="bn_reset"></button> <button class="b" id="bnClose" data-i="bn_close"></button></div>
  <div id="help" data-i="help"></div>
  <div id="hov" class="hide"></div>
</div>
<div class="pnl hide" id="volPop" style="position:fixed;z-index:8;padding:10px 12px;width:240px;font-size:13px">
  <div style="font-weight:800;margin-bottom:6px" data-i="vol_title"></div>
  <div>🔊 <span data-i="vol_master"></span></div><input type="range" id="vpMaster" min="0" max="1" step="0.05" style="width:100%">
  <div>💥 <span data-i="vol_sfx"></span></div><input type="range" id="vpSfx" min="0" max="1" step="0.05" style="width:100%">
  <div>🎵 <span data-i="set_vol"></span></div><input type="range" id="vpMusic" min="0" max="1" step="0.05" style="width:100%">
  <label style="display:block;margin-top:6px"><input type="checkbox" id="vpMute"> 🔇 <span data-i="vol_mute"></span></label>
</div>
<div id="toast"></div>
<div id="end" class="hide"><div class="pnl" id="endP"></div></div>
<div id="modal" class="hide"><div class="pnl" id="modalP"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/models.js"></script>
<script src="js/engine.js"></script>
<script src="js/terrain.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
